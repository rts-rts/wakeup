# Wake-on-LAN host inventory
# Format: name  ip  mac  [auto]
# auto — бот сам будит хост, если он offline (проверка каждые 10 минут).
#        Без auto хост включается только кнопкой в Telegram.
# Lines starting with # and blank lines are ignored
#
# name         ip               mac
# pc-office1   192.168.1.10     AA:BB:CC:DD:EE:FF
# nas-server   192.168.1.20     DE:AD:BE:EF:CA:FE   auto
ARTMAG01 192.168.10.100 18:c0:4d:08:e9:af auto
SYS 192.168.10.81 d8:bb:c1:07:06:aa
TANYA 192.168.10.96 d4:5d:64:01:f9:f6
KIRILL 192.168.10.72 2c:f0:5d:e1:31:32